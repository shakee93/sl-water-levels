# Satellite rainfall per river catchment (JAXA GSMaP_NOW) -> `data` branch under gsmap/.
# JAXA publishes a new half-hour step at about :01 and :31, so this runs at :10 and :40 UTC.
# Needs the repository secrets JAXA_FTP_USER and JAXA_FTP_PASSWORD (the JAXA GSMaP FTP login).
# The Cloudflare scheduler (workers/scheduler) also starts it; this cron is the backup.

name: GSMaP snapshot

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # to start the X account job below

# Same group as the other snapshot jobs so none of them push to `data` at once.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  gsmap:
    # One heavy D1 writer at a time (curw-snapshot, store-forecasts, gsmap-snapshot share this group).
    concurrency:
      group: d1-writes
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # Until the owner adds the secrets, skip quietly (no failure, no Slack alert every 30 min).
      - name: Check JAXA secrets
        id: secrets
        env:
          JAXA_FTP_USER: ${{ secrets.JAXA_FTP_USER }}
          JAXA_FTP_PASSWORD: ${{ secrets.JAXA_FTP_PASSWORD }}
        run: |
          if [ -z "$JAXA_FTP_USER" ] || [ -z "$JAXA_FTP_PASSWORD" ]; then
            echo "::warning::JAXA_FTP_USER and/or JAXA_FTP_PASSWORD repository secrets are missing; skipping. Add both under Settings > Secrets and variables > Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - name: Check out data branch
        if: steps.secrets.outputs.ready == 'true'
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add archive FETCH_HEAD
            git -C archive checkout -B data
          else
            git worktree add --orphan -b data archive
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Compute catchment rain
        if: steps.secrets.outputs.ready == 'true'
        env:
          JAXA_FTP_USER: ${{ secrets.JAXA_FTP_USER }}
          JAXA_FTP_PASSWORD: ${{ secrets.JAXA_FTP_PASSWORD }}
        run: node scripts/gsmap-snapshot.mjs archive

      # Daily rain from rain GAUGES (Met Dept SYNOP via OGIMET + Irrigation Dept rain_fall) -> rain-gauges/YYYY.jsonl on the
      # data branch. Feeds the SHADOW street-flood rule (scripts/street-rain-log.mjs) and is a valuable archive on its own.
      # Best effort: never fails the run (OGIMET is rate-limited and is only asked every 3 h).
      - name: Archive daily gauge rain
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: node scripts/rain-gauges-snapshot.mjs archive

      # The rain forecast as it was issued (deterministic + heavier scenario, next 6 / 24 h per catchment) and the gauges' own
      # measured rain, from the site's /api/rain -> rain-forecast/ on the data branch (scripts/rain-forecast-snapshot.mjs).
      # Best effort: a slow weather API never fails the satellite run.
      - name: Archive the rain forecast as issued
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        run: node scripts/rain-forecast-snapshot.mjs archive

      - name: Commit and push
        if: steps.secrets.outputs.ready == 'true'
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "GSMaP $(date -u '+%F %H:%M') UTC"
          # another job may have pushed to data meanwhile
          git pull --rebase origin data || true
          git push origin data

      # Live validation of the street-rain rule (scripts/street-rain-log.mjs): log what the rule says into
      # Cloudflare D1, record state changes, and tell Slack when it rises or clears. After the push, so a D1
      # or Slack problem never delays the rain data itself. Needs CLOUDFLARE_API_TOKEN (already used by
      # store-forecasts.yml); skipped with a warning without it.
      - name: Log the street-rain rule and notify
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: 83e812aa5ee674fe01ce3a9eb1e04cbe
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is missing; the street-rain log is skipped."
            exit 0
          fi
          node --experimental-strip-types --no-warnings scripts/street-rain-log.mjs archive

      # Web Push alerts for pinned places (scripts/push-notify.mjs): a rise or an all-clear since the last run. After
      # the rain data is pushed and the street-rain log is written, and never able to fail the snapshot. Skipped
      # quietly until the VAPID secrets exist.
      - name: Send push alerts
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$VAPID_PUBLIC_KEY" ] || [ -z "$VAPID_PRIVATE_KEY" ] || [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Push alerts are not set up yet (VAPID secrets missing); skipped."
            exit 0
          fi
          npm install --no-save --no-audit --no-fund web-push@3.6.7
          node --experimental-strip-types --no-warnings scripts/push-notify.mjs --mode check

      # The X account (scripts/x-post.mjs): look for something worth posting (dry-run to Slack until the owner flips
      # X_POSTING=live). A separate workflow with its own concurrency group so posts never double. Never fails the snapshot.
      - name: Start the X account job
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run x-post.yml --repo "${{ github.repository }}"

      # The Instagram account (scripts/ig-post.mjs): same trigger as the X account, dry-run to Slack until IG_MODE=live and both
      # secrets exist. Its own concurrency group. Never fails the snapshot.
      - name: Start the Instagram account job
        if: steps.secrets.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ig-post.yml --repo "${{ github.repository }}"

      # Slack only hears about a workflow that has failed 3 runs in a row (the 3rd failure, then every 12th): a single D1 or API
      # blip on a job that runs every 5-30 minutes fixes itself on the next run. Cancelled/skipped runs do not count either way.
      # If the history cannot be read, it alerts (fail open).
      - name: Tell Slack the workflow failed (3 in a row)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          n=0
          if hist=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${{ github.workflow }}" --status completed --limit 30 --json databaseId,conclusion --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.conclusion == "success" or .conclusion == "failure") | .conclusion] | join(" ")' 2>/dev/null); then
            for c in $hist; do [ "$c" = "failure" ] && n=$((n+1)) || break; done
          else
            n=2
          fi
          streak=$((n+1))
          if [ "$streak" -ne 3 ] && [ $((streak % 12)) -ne 0 ]; then
            echo "Failed run #$streak in a row: not alerting Slack until the 3rd."
            exit 0
          fi
          curl -sS -o /dev/null --max-time 20 -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"⚠️ Workflow failed $streak runs in a row: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL" || true
