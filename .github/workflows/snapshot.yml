# Archives every gauge reading to the `data` branch, one CSV per Sri Lanka day.
#
# The ArcGIS gauges_2_view feed only keeps a rolling ~7 days, so without this
# the history is lost. scripts/snapshot.mjs merges by objectid, so runs are
# idempotent and a skipped run is filled in by the next one (within 7 days).
# Twice a day because GitHub's scheduler sometimes delays or drops cron runs.
# It then rebuilds history.json for the /history page.
# Writing to a separate branch keeps these commits from triggering Vercel
# deploys of main.

name: Daily data snapshot

on:
  schedule:
    - cron: "30 19 * * *" # 01:00 Asia/Colombo
    - cron: "30 7 * * *" # 13:00 Asia/Colombo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add archive FETCH_HEAD
            git -C archive checkout -B data
          else
            git worktree add --orphan -b data archive
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch readings
        run: node scripts/snapshot.mjs archive

      # Feeds the /history page. Non-fatal: a failed model fetch shouldn't
      # lose the day's readings, which are the irreplaceable part.
      - name: Rebuild history.json
        continue-on-error: true
        run: node scripts/build-history.mjs archive

      - name: Commit and push
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new readings."
            exit 0
          fi
          git commit -m "Snapshot $(TZ=Asia/Colombo date +%F)"
          git push origin data
