# Cloudflare Worker that starts the repo's GitHub Actions workflows on time.
# GitHub's own cron is best-effort and was delaying/skipping our hourly and
# 15-minute jobs (23 Oct 2026: the hourly forecast store ran ~every 3-6 h and
# the release archive never ran on schedule). Cloudflare cron triggers fire
# reliably; the workflows keep their own schedules as a backup and use
# concurrency groups, so a double start is harmless.
name = "sl-water-levels-scheduler"
main = "index.mjs"
compatibility_date = "2026-10-01"

[triggers]
# All times UTC. Colombo = UTC+05:30.
crons = [
  "*/5 * * * *",   # X posts within ~5 min of a new gauge reading; release snapshots + CUrW every 15 min (filtered in code)
  "25 * * * *",    # forecast store, hourly
  "7,37 * * * *",  # health check + GSMaP satellite rain (JAXA posts at :01/:31), every 30 min
  "17,47 * * * *", # gauge-corrected satellite rain, after the :07/:37 snapshots
  "30 7,19 * * *", # gauge snapshot, 13:00 and 01:00 Colombo
  "0 1 1 * *",     # monthly prediction export, 06:30 Colombo on the 1st
  "50 18 * * *",   # nightly learning pipeline (learn-all.yml), 00:20 Colombo
]

[vars]
REPO = "shakee93/sl-water-levels"
