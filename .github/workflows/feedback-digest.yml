# Owner Slack for "Is this right?" feedback: the daily digest (from 08:00 Sri Lanka time, once a day) and a catch-up for urgent
# answers the site could not ping itself (scripts/feedback-digest.mjs). Reads Cloudflare D1; sends nothing without SLACK_WEBHOOK_URL.

name: Feedback digest

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feedback-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_ACCOUNT_ID: 83e812aa5ee674fe01ce3a9eb1e04cbe
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Send urgent catch-up and the daily digest
        run: node scripts/feedback-digest.mjs
