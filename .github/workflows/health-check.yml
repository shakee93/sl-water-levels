name: Data health check

# Every 30 minutes: ask the live site how every data source is doing (/api/health?deep=1 bypasses
# the caches), then scripts/health-alert.mjs opens / updates / closes one GitHub issue per failing
# check and posts to Slack. A check must fail twice in a row before anything is opened. A confirmed
# critical failure fails this run, which makes GitHub email the owner.
# Slack: needs the SLACK_WEBHOOK_URL secret (optional; skipped silently when missing).

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      slack_test:
        description: "Send the one-off 'monitoring is connected' Slack message"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  actions: write # to start the GSMaP job below

concurrency:
  group: health-check
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SITE_URL: https://waterlevels.lk
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The satellite-rain and CUrW snapshots are started by the Cloudflare scheduler (workers/scheduler, :07/:37 and every
      # 15 min). They used to be started from here too, which ran the satellite-rain job twice every half hour (each run also
      # queries the Irrigation Department's ArcGIS for gauge rain); removed 26 Oct 2026 to stop the double load.
      - name: Slack connection test (manual runs only)
        if: github.event_name == 'workflow_dispatch' && inputs.slack_test
        run: node scripts/health-alert.mjs --slack-test

      - name: Fetch health
        run: |
          # Retry once; a missing/invalid file is treated by the alert script as "site down".
          for i in 1 2; do
            if curl -fsS --max-time 100 "$SITE_URL/api/health?deep=1" -o health.json; then break; fi
            rm -f health.json
            [ "$i" = 1 ] && sleep 30
          done
          if [ -f health.json ]; then node -e 'const r=JSON.parse(require("fs").readFileSync("health.json","utf8")); for (const c of r.checks) console.log((c.ok?"ok  ":"FAIL"), c.severity.padEnd(8), c.id.padEnd(20), c.detail)'; fi
        continue-on-error: true

      - name: Alert
        run: node scripts/health-alert.mjs health.json

      # Crawler-facing files and structured data (robots, llms.txt, sitemap, JSON-LD, FAQ, feeds).
      # Runs even when the data alert above failed; a failure here fails the run, so GitHub emails the owner.
      - name: SEO and AI-crawler check
        if: always()
        run: node scripts/seo-check.mjs

      # Real 404s for junk addresses, case and old-name redirects, no redirect on real pages (~40 requests).
      - name: Redirect and 404 check
        if: always()
        run: node scripts/redirect-check.mjs "$SITE_URL" --quick
