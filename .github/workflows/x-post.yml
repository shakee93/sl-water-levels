# The site's X (Twitter) account: alerts, all-clears, storm updates and the morning summary (scripts/x-post.mjs).
#   - DRY RUN by default: posts go to the owner's Slack (SLACK_WEBHOOK_URL) marked "DRY RUN", nothing goes to X.
#   - LIVE only when the repository VARIABLE X_POSTING is "live" AND all four secrets exist (X_API_KEY, X_API_SECRET,
#     X_ACCESS_TOKEN, X_ACCESS_SECRET). X_POSTING=off is the kill switch: the job does nothing.
#   - Started after every satellite-rain snapshot (gsmap-snapshot.yml, every 30 min) and by the 06:30 Colombo cron below
#     (GitHub's cron is best-effort: the morning summary is sent by the first run after 06:30 and only once a day).
#   - Manual: mode "run" = one normal pass; mode "sample" = up to 3 sample posts from today's data to Slack only.
# One post per run: everything that would post is combined (lib/xAggregate.ts); routine updates within X_MIN_GAP_MIN (45) minutes of
# the last post wait for the next one; X_LONG_POSTS=1 (X Premium) lifts the 280-character limit.
# Pictures: X_MEDIA (off|alerts|all, default alerts) attaches the site's square story image (with alt text) to Alert/Minor/Major rises and the
# morning summary ("all" adds all-clears, storm updates, warnings, the evening summary); X_COST_MEDIA (0) and X_COST_MEDIA_ALT (0.005) feed the
# cost estimate. A picture that cannot be fetched or uploaded never blocks the post: it goes out text-only.
# Optional variables: X_LINKS (off|alerts|all, default off), X_MEDIA, X_REPLIES (on), X_LANGS (en,si,ta), X_EVENING (on),
# X_DAILY_MAX, X_MONTHLY_BUDGET_USD, X_COST_POST, X_COST_LINK_POST, X_AI_POLISH (off = no AI writer), X_AI_TEMPERATURE.
# Secret OPENAI_API_KEY makes gpt-6-luna write every post in a human voice from the facts (every number checked against
# the facts, one retry, then the plain template). Without the secret the plain templates are used and Slack says so.
# See DOCS.md "X account".

name: X account

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "40 1 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = one normal pass now; sample = up to 3 sample posts from today's data, to Slack only"
        type: choice
        options: [run, sample]
        default: run

permissions:
  contents: read
  actions: read # failure history for the Slack rule

# One at a time, never cancelled half-way: two runs must not post the same thing.
concurrency:
  group: x-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Post
        env:
          MODE: ${{ github.event.inputs.mode || 'run' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          X_POSTING: ${{ vars.X_POSTING }}
          X_LINKS: ${{ vars.X_LINKS }}
          X_MEDIA: ${{ vars.X_MEDIA }}
          X_COST_MEDIA: ${{ vars.X_COST_MEDIA }}
          X_COST_MEDIA_ALT: ${{ vars.X_COST_MEDIA_ALT }}
          X_REPLIES: ${{ vars.X_REPLIES }}
          X_LANGS: ${{ vars.X_LANGS }}
          X_EVENING: ${{ vars.X_EVENING }}
          X_LONG_POSTS: ${{ vars.X_LONG_POSTS }}
          X_MIN_GAP_MIN: ${{ vars.X_MIN_GAP_MIN }}
          X_DAILY_MAX: ${{ vars.X_DAILY_MAX }}
          X_MONTHLY_BUDGET_USD: ${{ vars.X_MONTHLY_BUDGET_USD }}
          X_COST_POST: ${{ vars.X_COST_POST }}
          X_COST_LINK_POST: ${{ vars.X_COST_LINK_POST }}
          X_AI_POLISH: ${{ vars.X_AI_POLISH }}
          X_AI_TEMPERATURE: ${{ vars.X_AI_TEMPERATURE }}
        run: |
          if [ "$MODE" != "sample" ] && [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN is missing: the X account keeps its memory in D1, so nothing is posted."
            exit 0
          fi
          node --experimental-strip-types --no-warnings scripts/x-post.mjs --mode "$MODE"

      # Slack only hears about a workflow that has failed 3 runs in a row (the 3rd failure, then every 12th): a single D1 or API
      # blip on a job that runs every 5-30 minutes fixes itself on the next run. Cancelled/skipped runs do not count either way.
      # If the history cannot be read, it alerts (fail open).
      - name: Tell Slack the workflow failed (3 in a row)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          n=0
          if hist=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "${{ github.workflow }}" --status completed --limit 30 --json databaseId,conclusion --jq '[.[] | select(.databaseId != ${{ github.run_id }}) | select(.conclusion == "success" or .conclusion == "failure") | .conclusion] | join(" ")' 2>/dev/null); then
            for c in $hist; do [ "$c" = "failure" ] && n=$((n+1)) || break; done
          else
            n=2
          fi
          streak=$((n+1))
          if [ "$streak" -ne 3 ] && [ $((streak % 12)) -ne 0 ]; then
            echo "Failed run #$streak in a row: not alerting Slack until the 3rd."
            exit 0
          fi
          curl -sS -o /dev/null --max-time 20 -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"⚠️ Workflow failed $streak runs in a row: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL" || true
