# Archives RiverNet (rivernet.lk) river levels to the `data` branch under rivernet/ (5-minute points per Colombo day)
# (compact JSON per Colombo day, merged each run). Every 2 hours; RiverNet serves the last 24 h each time, so a skipped run heals.
# This is the history RiverNet does not publish (it serves 24 h): the 1-minute sensors and the tributary gauges can later be backtested and their travel times fitted.

name: RiverNet snapshot

# Started every 2 h (even UTC hours, :25) by the Cloudflare scheduler (workers/scheduler), not GitHub's cron, which skipped most runs.
on:
  workflow_dispatch:

permissions:
  contents: write

# Same group as the other data-branch writers so they never push at once.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  rivernet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add archive FETCH_HEAD
            git -C archive checkout -B data
          else
            git worktree add --orphan -b data archive
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Archive RiverNet
        run: node --experimental-strip-types scripts/rivernet-snapshot.mjs archive

      - name: Commit and push
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git commit -m "RiverNet $(TZ=Asia/Colombo date '+%F %H:%M')"
          # Another writer (hmis, gsmap, forecast archive...) may have pushed to data meanwhile: rebase onto it and retry, so a lost
          # race never loses a snapshot. Our files (rivernet/*) are only written here, so the rebase has nothing to conflict on.
          for i in 1 2 3 4; do
            if git push origin data; then exit 0; fi
            echo "push rejected (attempt $i), rebasing onto origin/data"
            sleep $((i * 5))
            git pull --rebase origin data
          done
          echo "::error::could not push the RiverNet snapshot after 4 attempts"
          exit 1

      - name: Tell Slack the workflow failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # lets the step also write the notification log (lib/notify.mjs); optional
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          MSG="⚠️ Workflow failed: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Through the notification log (lib/notify.mjs) when the checkout exists: same Slack text, plus one row in D1.
          # A failed checkout, a missing node or a refused post falls back to the plain request, so Slack still hears it.
          if [ -f scripts/notify-cli.mjs ] && node scripts/notify-cli.mjs --source "workflow:${{ github.workflow }}" --kind workflow-failed --severity error "$MSG"; then exit 0; fi
          curl -sS -o /dev/null --max-time 20 -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"$MSG\"}" \
            "$SLACK_WEBHOOK_URL" || true
