# Nightly forecast scoreboard (MEASURES ONLY: nothing here changes the live forecast, a verdict, an alert or a push).
# Just after the Sri Lanka day ends (01:40 Colombo), for the two days before today:
#   1. scripts/forecast-archive.mjs  D1 prediction log -> forecasts/YYYY/YYYY-MM-DD.jsonl on the `data` branch (each stored forecast point
#      with the reading that followed it, the threshold chances and any shadow/candidate points). Yesterday is provisional (its 24 h points
#      are not observed yet) and is rewritten the next night.
#   2. scripts/forecast-scoreboard.mjs  archive -> scoreboard/YYYY-MM-DD.json + scoreboard/summary.csv (per group x horizon: n, MAE,
#      persistence MAE, skill, bias, in-band, calibration, runs per hour, difficulty, a better/worse/not-comparable line), live and shadow.
# Reads D1 with small queries (runs of one day, children by id range, observations per gauge by key range); needs only CLOUDFLARE_API_TOKEN.
#   3. scripts/forecast-kpi.mjs  archive -> kpi/latest.json (rolling 30 days: the ten forecast targets, live, each shadow variant, each version), kpi/days/YYYY-MM-DD.json,
#      kpi/history.csv. Read by the public /forecast-accuracy page. Definitions: lib/forecastKpi.mjs, DOCS.md "Forecast KPIs".
# Manual run: `from`/`to` (YYYY-MM-DD) re-archive and re-score a range, e.g. the 23-27 Oct backfill (D1 keeps readings for 7 days);
# `days` = 7 re-archives the seven Colombo days before today (what the 29 Oct KPI backfill needs: archive lines now carry the gauge readings in
# forecasts/YYYY/YYYY-MM-DD.readings.json and the heavy-rain flag, and older day files do not have them).
# Started by the Cloudflare scheduler (workers/scheduler/index.mjs, cron "10 20 * * *"): GitHub's own cron skipped runs, so there is no schedule here.
# No Slack message is sent on success; a failed run tells Slack like the other snapshot jobs.

name: Forecast scoreboard

on:
  workflow_dispatch:
    inputs:
      from:
        description: "First Colombo day to archive and score (YYYY-MM-DD); empty = the two days before today"
        required: false
      to:
        description: "Last day (YYYY-MM-DD); empty = same as from"
        required: false
      days:
        description: "Instead of from/to: re-archive the N Colombo days before today (7 = the whole week D1 still holds)"
        required: false

permissions:
  contents: write

# Same group as the other jobs that push to `data`.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: 83e812aa5ee674fe01ce3a9eb1e04cbe
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out data branch
        run: |
          git fetch --depth=1 origin data
          git worktree add archive FETCH_HEAD
          git -C archive checkout -B data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Work out the days
        id: range
        env:
          FROM: ${{ inputs.from }}
          TO: ${{ inputs.to }}
          DAYS: ${{ inputs.days }}
        run: |
          range=""
          if [ -n "$DAYS" ]; then
            today=$(TZ=Asia/Colombo date +%F)
            range="--from $(date -d "$today - $DAYS days" +%F) --to $(date -d "$today - 1 day" +%F)"
          elif [ -n "$FROM" ]; then
            range="--from $FROM --to ${TO:-$FROM}"
          fi
          echo "range=$range" >> "$GITHUB_OUTPUT"
          echo "Days: ${range:-default (the two days before today)}"
      - name: Archive the stored forecasts
        run: node scripts/forecast-archive.mjs archive ${{ steps.range.outputs.range }}
      - name: Score them
        run: |
          node scripts/forecast-scoreboard.mjs archive ${{ steps.range.outputs.range }} | tee scoreboard.txt
          { echo '### Forecast scoreboard'; echo '```'; cat scoreboard.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Forecast KPIs
        # rolling 30 days up to yesterday, recomputed from the whole archive every night (so a re-archived day is picked up)
        run: |
          node scripts/forecast-kpi.mjs archive | tee kpi.txt
          { echo '### Forecast KPIs'; echo '```'; cat kpi.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: "Level-model trial report (hidden trial, measures only; last and isolated: it cannot fail this job)" # quoted: a colon inside an unquoted name made this whole file invalid (12 Nov 2026)
        # scripts/level-trial-report.mjs -> kpi/level-trial/latest.json + days/YYYY-MM-DD.json (committed below). Catches every error itself, ends after its own
        # 90 s timer, and `continue-on-error` + the step timeout are two more guards: the archive and the KPIs above are already written when it starts.
        continue-on-error: true
        timeout-minutes: 3
        run: |
          timeout 100 node scripts/level-trial-report.mjs archive --budget-sec 90 | tee level-trial.txt || echo "::warning::level trial report did not finish"
          { echo '### Level-model trial'; echo '```'; cat level-trial.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Commit and push
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forecasts scoreboard kpi
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Forecast archive, scoreboard and KPIs $(date -u '+%F %H:%M') UTC"
          git pull --rebase origin data || true
          git push origin data

      - name: Tell Slack the workflow failed
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }} # lets the step also write the notification log (lib/notify.mjs); optional
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          MSG="⚠️ Workflow failed: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Through the notification log (lib/notify.mjs) when the checkout exists: same Slack text, plus one row in D1.
          # A failed checkout, a missing node or a refused post falls back to the plain request, so Slack still hears it.
          if [ -f scripts/notify-cli.mjs ] && node scripts/notify-cli.mjs --source "workflow:${{ github.workflow }}" --kind workflow-failed --severity error "$MSG"; then exit 0; fi
          curl -sS -o /dev/null --max-time 20 -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"$MSG\"}" \
            "$SLACK_WEBHOOK_URL" || true
