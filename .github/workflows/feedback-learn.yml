# The learning loop (scripts/feedback-learn.mjs, lib/learnedParams.mjs): once a day, just after the Sri Lanka day ends (00:50), joins the
# "Does this match what you see?" answers and street-flood reports with the gauge, forecast and satellite-rain records and writes a few
# bounded, evidence-gated numbers to learned/town-params.json on the `data` branch. The site reads it for notes and heads-ups only; the
# verdict step stays official. Reads Cloudflare D1 (about 30k rows); one run a day.
# Manual run: dry_run = true prints the JSON and the Slack text and writes nothing.

name: Feedback learn

# Since 27 Oct 2026 the nightly run is .github/workflows/learn-all.yml (it contains this job's maths plus the observation table, ground-rain proposals,
# forecast tests and the map re-fit flag), so this one has no schedule and is kept for manual runs.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what would be written, change nothing, send nothing"
        type: boolean
        default: false

permissions:
  contents: write

# Same group as the other jobs that push to `data`.
concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: 83e812aa5ee674fe01ce3a9eb1e04cbe
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Check out data branch
        run: |
          git fetch --depth=1 origin data
          git worktree add archive FETCH_HEAD
          git -C archive checkout -B data
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: node --experimental-strip-types scripts/feedback-learn.mjs --dry-run
      - name: Learn from the answers
        if: ${{ !inputs.dry_run }}
        run: node --experimental-strip-types scripts/feedback-learn.mjs archive
      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        working-directory: archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learned
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Learned parameters $(date -u '+%F') UTC"
          git pull --rebase origin data || true
          git push origin data

      - name: Tell Slack the workflow failed
        if: failure()
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && exit 0
          curl -sS -o /dev/null --max-time 20 -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"⚠️ Workflow failed: ${{ github.workflow }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL" || true
